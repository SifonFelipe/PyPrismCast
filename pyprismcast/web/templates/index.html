<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0b0f">
    <title>PyPrismCast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

    <!-- Casting banner: persistent status, mirrors the native Chromecast
         mini-controller so you always know what's playing and can pause
         right from here. -->
    <div id="cast-banner" class="cast-banner" data-state="connecting">
        <span class="cast-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="20" height="20" fill="none">
                <circle cx="7" cy="25" r="2.4" fill="currentColor" />
                <path class="wave wave-1" d="M4 19a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
                <path class="wave wave-2" d="M4 13a16 16 0 0 1 16 16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
                <path class="wave wave-3" d="M4 7a22 22 0 0 1 22 22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            </svg>
        </span>
        <div class="cast-banner__text">
            <strong id="cast-banner-title">Connecting</strong>
            <span id="cast-banner-subtitle">Searching your Chromecast&hellip;</span>
        </div>
        <button id="banner-play-pause" class="cast-banner__action" title="Play / Pause" hidden></button>
        <span id="player-state" class="state-pill">IDLE</span>
    </div>

    <main class="player">

        <section class="poster">
            <div class="poster__glow" aria-hidden="true"></div>
            <button id="subtitles-btn" class="poster__subtitles-btn" title="Subtitles Config"
              aria-label="Configure Subtitles" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
                    <rect x="2.5" y="5" width="19" height="14" rx="3" stroke="currentColor" stroke-width="1.8" />
                    <path d="M8.2 10.3c-.5-.5-1.2-.8-2-.8-1.6 0-2.7 1.1-2.7 2.5s1.1 2.5 2.7 2.5c.8 0 1.5-.3 2-.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                    <path d="M17.5 10.3c-.5-.5-1.2-.8-2-.8-1.6 0-2.7 1.1-2.7 2.5s1.1 2.5 2.7 2.5c.8 0 1.5-.3 2-.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
            </button>
            <div class="poster__art">
                <svg viewBox="0 0 48 48" width="40" height="40" fill="none">
                    <rect x="5" y="9" width="38" height="30" rx="6" stroke="currentColor" stroke-width="2.4" />
                    <path d="M20 18l11 6-11 6z" fill="currentColor" />
                </svg>
            </div>
            <div class="poster__meta">
                <p class="eyebrow">Playing on your TV</p>
                <h1 id="movie-title">No content</h1>
            </div>
        </section>

        <section class="timeline">
            <input
                id="seek-bar"
                type="range"
                min="0"
                max="0"
                value="0"
                step="0.1"
                aria-label="Reproduction timeline"
            >
            <div class="time-labels">
                <span id="current-time">00:00</span>
                <span id="duration">00:00</span>
            </div>
        </section>

        <section class="controls">
            <button id="backward" class="secondary" title="Back 10 seconds" aria-label="Back 10 seconds">
                <span>−10</span>
            </button>
            <button id="play-pause" class="primary" title="Play / Pause" aria-label="Play / Pause">
                <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M8 5.6v12.8c0 .8.9 1.3 1.6.9l10.1-6.4c.6-.4.6-1.4 0-1.8L9.6 4.7c-.7-.4-1.6.1-1.6.9z" />
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" hidden>
                    <rect x="6" y="5" width="4.5" height="14" rx="1.2" />
                    <rect x="13.5" y="5" width="4.5" height="14" rx="1.2" />
                </svg>
            </button>
            <button id="forward" class="secondary" title="Skip forward 10 seconds" aria-label="Skip forward 10 seconds">
                <span>+10</span>
            </button>
        </section>

        <section class="secondary-controls">
            <button id="volume-down" aria-label="Volume down">−</button>
            <div class="volume">
                <div class="volume__track" aria-hidden="true">
                    <div id="volume-fill" class="volume__fill"></div>
                </div>
                <span id="volume-level">100%</span>
            </div>
            <button id="volume-up" aria-label="Volume up">+</button>
        </section>

        <button id="stop" class="stop">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
                <rect x="2" y="2" width="12" height="12" rx="2" />
            </svg>
            Stop casting
        </button>

    </main>

</div>

    <!-- Subtitle settings modal -->
    <div id="subtitle-modal" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="subtitle-modal-title">
            <header class="modal__header">
                <h2 id="subtitle-modal-title">Subtitles</h2>
                <button id="subtitle-modal-close" class="modal__close" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
                        <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </header>

            <div class="modal__body">
                <label class="switch-row">
                    <span>Toggle Subtitles</span>
                    <span class="switch">
                        <input type="checkbox" id="subtitle-enabled-toggle">
                        <span class="switch__track" aria-hidden="true"></span>
                    </span>
                </label>

                <div id="subtitle-options" class="subtitle-options">
                    <label class="field">
                        <span class="field__label">
                            Font size
                            <span id="subtitle-scale-value" class="field__value">1.0x</span>
                        </span>
                        <input type="range" id="subtitle-scale" min="0.5" max="2" step="0.1" value="1">
                    </label>

                    <div class="field-row">
                        <label class="field field--color">
                            <span class="field__label">Text color</span>
                            <input type="color" id="subtitle-fg-color" value="#ffffff">
                        </label>
                        <label class="field">
                            <span class="field__label">
                                Opacity
                                <span id="subtitle-fg-opacity-value" class="field__value">100%</span>
                            </span>
                            <input type="range" id="subtitle-fg-opacity" min="0" max="100" value="100">
                        </label>
                    </div>

                    <div class="field-row">
                        <label class="field field--color">
                            <span class="field__label">Background color</span>
                            <input type="color" id="subtitle-bg-color" value="#000000">
                        </label>
                        <label class="field">
                            <span class="field__label">
                                Opacity
                                <span id="subtitle-bg-opacity-value" class="field__value">0%</span>
                            </span>
                            <input type="range" id="subtitle-bg-opacity" min="0" max="100" value="0">
                        </label>
                    </div>

                    <label class="field">
                        <span class="field__label">Text border</span>
                        <select id="subtitle-edge-type">
                            <option value="NONE">None</option>
                            <option value="OUTLINE">Outline</option>
                            <option value="DROP_SHADOW">Shadow</option>
                            <option value="RAISED">Raised</option>
                            <option value="DEPRESSED">Depressed</option>
                        </select>
                    </label>

                    <label class="field field--color">
                        <span class="field__label">Border color</span>
                        <input type="color" id="subtitle-edge-color" value="#000000">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Silent looping audio: without an actual playing media element,
         mobile browsers won't surface the OS-level media notification
         (lock screen / notification shade controls) that MediaSession
         drives below. -->
    <audio id="silent-audio" loop playsinline preload="auto" src="data:audio/wav;base64,UklGRmQfAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAfAACAgICAgICAg=="></audio>

<script src="{{ url_for('static', filename='js/app.js') }}?v=2"></script>
</body>
</html>
