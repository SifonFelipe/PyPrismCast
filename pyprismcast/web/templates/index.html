<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PyCast</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<main class="player">

    <header class="header">

        <div>
            <h1>PyCast</h1>
            <p id="connection-status">
                Connecting...
            </p>
        </div>

        <div class="state">
            <span id="player-state">
                IDLE
            </span>
        </div>

    </header>


    <section class="movie">

        <div class="movie-placeholder">
            <span id="movie-title">
                No media
            </span>
        </div>

    </section>


    <section class="timeline">

        <div class="time-labels">

            <span id="current-time">
                00:00
            </span>

            <span id="duration">
                00:00
            </span>

        </div>

        <input
            id="seek-bar"
            type="range"
            min="0"
            max="0"
            value="0"
            step="0.1"
        >

    </section>


    <section class="controls">

        <button
            id="backward"
            class="secondary"
            title="Retroceder 10 segundos"
        >
            <span>−10</span>
        </button>


        <button
            id="play-pause"
            class="primary"
            title="Reproducir / pausar"
        >
            ▶
        </button>


        <button
            id="forward"
            class="secondary"
            title="Avanzar 10 segundos"
        >
            <span>+10</span>
        </button>

    </section>


    <section class="secondary-controls">

        <button id="volume-down">
            −
        </button>

        <div class="volume">
            <span>Volume</span>

            <span id="volume-level">
                100%
            </span>
        </div>

        <button id="volume-up">
            +
        </button>

    </section>


    <button
        id="stop"
        class="stop"
    >
        Stop
    </button>

</main>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>
</html>
